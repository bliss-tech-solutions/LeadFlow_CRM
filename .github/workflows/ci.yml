name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w backend
      - name: Unit tests
        run: npm test -w backend
      - name: Build
        run: npm run build -w backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p frontend/tsconfig.json
      - name: Build
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Expo doctor (partner)
        run: APP_VARIANT=partner npx expo-doctor
      - name: Expo doctor (admin)
        run: APP_VARIANT=admin npx expo-doctor
      - name: Bundle partner (android)
        run: APP_VARIANT=partner npx expo export --platform android --output-dir dist-partner
      - name: Bundle admin (android)
        run: APP_VARIANT=admin npx expo export --platform android --output-dir dist-admin
      - name: Partner bundle must not contain admin screens
        run: |
          if grep -q "Webhook log" dist-partner/_expo/static/js/android/*.hbc; then
            echo "Admin screens leaked into the Partner bundle" && exit 1
          fi
